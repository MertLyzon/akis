[package]
name = "akis"
version = "0.3.0"
description = "Akış sosyal medya stüdyosu"
edition = "2021"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "akis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
# Keep the Rust and JavaScript Tauri packages on the same release family.
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-opener = "=2.6.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
