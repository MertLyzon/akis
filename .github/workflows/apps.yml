# Builds the Akış apps for every platform on GitHub's machines.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.3.0.
# Download the results from the run's "Artifacts" section.
name: Uygulamalar

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: akis_tests
          POSTGRES_USER: akis
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U akis -d akis_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.txt
      - name: SQLite tests
        run: mkdir -p work && python -m pytest -q
      - name: PostgreSQL tests
        env:
          AKIS_TEST_DATABASE_URL: postgresql+psycopg://akis:test-only-password@127.0.0.1:5432/akis_tests
        run: python -m pytest -q
      - name: PostgreSQL migrations
        env:
          DATABASE_URL: postgresql+psycopg://akis:test-only-password@127.0.0.1:5432/akis_tests
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini check
          python -m alembic -c backend/alembic.ini downgrade -1
          python -m alembic -c backend/alembic.ini upgrade head
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - run: npm ci && npm run build

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: windows, args: ''}
          - {os: macos-latest, name: macos, args: '--target universal-apple-darwin'}
          - {os: ubuntu-22.04, name: linux, args: ''}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: {workspaces: src-tauri}
      - name: Linux system libraries
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: akis-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage

  android:
    needs: test
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android'}
      - uses: swatinem/rust-cache@v2
        with: {workspaces: src-tauri}
      - run: npm ci
      - name: Build APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          npx tauri android init --ci
          # Debug-signed so it installs directly on a phone. For Google Play, see README (release signing).
          npx tauri android build --apk --debug --ci
      - uses: actions/upload-artifact@v4
        with:
          name: akis-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
