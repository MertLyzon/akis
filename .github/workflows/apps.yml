# Builds the Akış apps for every platform on GitHub's machines.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.3.0.
# Download the results from the run's "Artifacts" section.
name: Uygulamalar

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

concurrency:
  group: apps-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: akis_tests
          POSTGRES_USER: akis
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U akis -d akis_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.txt
      - name: SQLite tests
        run: mkdir -p work && python -m pytest -q
      - name: PostgreSQL tests
        env:
          AKIS_TEST_DATABASE_URL: postgresql+psycopg://akis:test-only-password@127.0.0.1:5432/akis_tests
        run: python -m pytest -q
      - name: PostgreSQL migrations
        env:
          DATABASE_URL: postgresql+psycopg://akis:test-only-password@127.0.0.1:5432/akis_tests
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini check
          python -m alembic -c backend/alembic.ini downgrade -1
          python -m alembic -c backend/alembic.ini upgrade head
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - run: npm ci && npm run build

  desktop:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: windows, args: ''}
          - {os: macos-latest, name: macos, args: '--target universal-apple-darwin'}
          - {os: ubuntu-22.04, name: linux, args: ''}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: {workspaces: src-tauri}
      - name: Linux system libraries
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Resolve pinned Rust dependencies
        run: cargo update --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build ${{ matrix.args }}
      - name: Save resolved Cargo lockfile
        if: always() && matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: akis-resolved-cargo-lock
          path: src-tauri/Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: akis-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage

  android:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Android SDK packages
        run: |
          sdkmanager_path=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -x "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android'}
      - uses: swatinem/rust-cache@v2
        with: {workspaces: src-tauri}
      - run: npm ci
      - name: Resolve pinned Rust dependencies
        run: cargo update --manifest-path src-tauri/Cargo.toml
      - name: Build APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          test -d "$NDK_HOME"
          npx tauri android init --ci
          # Debug-signed so it installs directly on a phone. For Google Play, see README (release signing).
          npx tauri android build --apk --debug --ci
      - uses: actions/upload-artifact@v4
        with:
          name: akis-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  docker:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Create disposable Docker secrets
        run: python scripts/bootstrap.py
      - name: Build and start the complete stack
        run: docker compose up -d --build
      - name: Wait for nginx and API
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Verify nginx headers, compression and trusted proxy boundary
        run: |
          headers=$(mktemp)
          curl --silent --show-error --dump-header "$headers" --output /dev/null http://127.0.0.1:8080/
          grep --ignore-case '^Content-Security-Policy:' "$headers"
          grep --ignore-case '^X-Frame-Options: DENY' "$headers"
          grep --ignore-case '^X-Content-Type-Options: nosniff' "$headers"
          grep --ignore-case '^Referrer-Policy: no-referrer' "$headers"
          grep --ignore-case '^Permissions-Policy:' "$headers"

          asset=$(curl --silent http://127.0.0.1:8080/ | grep -oE '/assets/[^" ]+\.js' | head -n 1)
          test -n "$asset"
          curl --silent --compressed --dump-header "$headers" --output /dev/null "http://127.0.0.1:8080$asset"
          grep --ignore-case '^Content-Encoding: gzip' "$headers"

          for attempt in $(seq 1 6); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --request POST http://127.0.0.1:8080/api/login \
              --header 'Content-Type: application/json' \
              --header 'Origin: http://localhost:8080' \
              --header "X-Forwarded-For: 203.0.113.$attempt" \
              --data '{"email":"admin@akis.local","password":"wrong-password"}')
          done
          test "$status" = '429'
      - name: Show container logs after a failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
