server {
    listen 80;
    server_name _;
    client_max_body_size 101m;
    root /usr/share/nginx/html;
    server_tokens off;

    # JS/CSS bundles and API JSON shrink 70–85%; images and videos are already compressed.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    # nginx drops server-level add_header in any location that sets its own, so the studio
    # security headers are repeated in each static location below. /api gets them from FastAPI.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com; media-src 'self' blob: https://res.cloudinary.com; connect-src 'self'; font-src 'self' data:; object-src 'none'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";

    location /api/ {
        proxy_pass http://__API_UPSTREAM__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # Uvicorn reads the client address from here (login rate limit is per IP).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        # Uploads stream straight to the API instead of being buffered to nginx's disk first.
        proxy_request_buffering off;
        # Callback codes and signed media URLs must not enter access logs.
        access_log off;
    }
    # The service worker and manifest must be revalidated so new releases reach installed apps.
    location = /sw.js { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff; try_files $uri =404; }
    location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff; try_files $uri =404; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; add_header X-Content-Type-Options nosniff; try_files $uri =404; }
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri /index.html;
    }
}
